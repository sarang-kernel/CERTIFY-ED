name: ci
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.17.1 build
      - run: ruff check certify_ed tests experiments conformance
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: certify-ed env
      - run: python -m certify_ed.schema --check schema
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install certify-ed with every optional layer
        run: pip install -e .[all]
      # QuSpin 1.0.1 declares the obsolete `importlib` backport; install its real dependencies, then the wheel
      # without dependency resolution (docs/reproducibility.md, "Installing QuSpin 1.0.1")
      - name: Install QuSpin 1.0.1
        run: |
          pip install quspin-extensions parallel-sparse-tools dill joblib numba numexpr six gmpy2
          pip install quspin==1.0.1 --no-deps
      - run: certify-ed env
      - name: Conformance of the reference bundles
        run: certify-ed conform conformance/reference/dense-arrays conformance/reference/npz conformance/reference/matrix-free --require-jsonschema
      - name: Test suite
        shell: bash
        # recorded radii are compared exactly; one BLAS thread keeps the summation order of the recording
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
        run: pytest -q -p no:cacheprovider 2>&1 | tee pytest-${{ matrix.os }}-py${{ matrix.python-version }}.log; test ${PIPESTATUS[0]} -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-log-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pytest-*.log

  quick-reproduce:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .[all]
      - run: |
          pip install quspin-extensions parallel-sparse-tools dill joblib numba numexpr six gmpy2
          pip install quspin==1.0.1 --no-deps
      - run: python run.py --no-tests --skip E0,E7 --jobs 2
      - uses: actions/upload-artifact@v4
        with:
          name: quick-run
          path: results/
