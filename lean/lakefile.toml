name = "certify_ed_lean"
defaultTargets = ["CertifyCore", "CertifyMathlib"]

# Mathlib release matching the Lean toolchain v4.35.0. CertifyCore never imports Mathlib (core Lean only);
# CertifyMathlib does.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "CertifyCore"

[[lean_lib]]
name = "CertifyMathlib"

[[lean_lib]]
name = "CertifyApps"

# Compiled exact checker of certificates (core Lean, trust level N); root module written by the core track.
[[lean_exe]]
name = "cecheck"
root = "CertifyCore.Main"

# Compiled recomputation of the application numbers (core Lean, trust level N).
[[lean_exe]]
name = "ceapps"
root = "CertifyApps.Main"
