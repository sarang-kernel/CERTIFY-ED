[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certify-ed"
version = "3.3.0.dev0"
description = "Certificates for exact-diagonalization results: rigorous enclosures, completeness, labels and exact re-checks, with applications to published proofs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "Sarang Vehale", email = "sarangvehale2@gmail.com" },
    { name = "Ritu Goel" },
]
keywords = ["exact diagonalization", "verified computing", "eigenvalue enclosure", "interval arithmetic",
            "quantum many-body", "certificates"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
exact = ["python-flint>=0.6"]          # exact re-check layer, Arb references, applications
quspin = ["quspin>=1.0"]               # importers, label audits, QuSpin cross-checks (see docs/reproducibility.md:
                                       # the wheel needs quspin-extensions and parallel-sparse-tools next to it)
hdf5 = ["h5py>=3.0"]
plots = ["matplotlib>=3.5"]
schema = ["jsonschema>=4.18"]          # validate certificates against schema/certificate-2.1.schema.json (draft 2020-12)
test = ["pytest>=7.0", "hypothesis>=6"]     # hypothesis: property tests (tests/test_properties_fp.py)
dev = ["pytest>=7.0", "hypothesis>=6", "pytest-cov", "ruff", "build", "jsonschema>=4.18"]
all = ["python-flint>=0.6", "quspin>=1.0", "h5py>=3.0", "matplotlib>=3.5", "jsonschema>=4.18", "pytest>=7.0"]

[project.scripts]
certify-ed = "certify_ed.cli:main"

[project.urls]
Preprint-v1 = "https://arxiv.org/abs/2605.11787"
Preprint-symveig = "https://arxiv.org/abs/2606.16217"

[tool.setuptools.packages.find]
include = ["certify_ed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 120
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E9", "F", "B"]
ignore = ["B905", "B028", "E731", "E741"]
